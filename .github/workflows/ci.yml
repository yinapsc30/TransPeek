name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      CI: "true" # 跳过需要登录钥匙串的测试
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Test TransPeekKit
        working-directory: Packages/TransPeekKit
        run: swift test

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build app
        run: |
          xcodebuild -project TransPeek.xcodeproj -scheme TransPeek -configuration Release \
            -derivedDataPath build build
